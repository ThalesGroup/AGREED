[project]
name = "AGREED"
version = "0.1.0"
description = "Adaptive Grouping to REduce Explanation Disagreements"
authors = [
    {name = "Gabriel Laberge", email="gabriel.laberge@thalesgroup.com"}
]
readme = "README.md"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch-src"
# Uncomment to use torch with cuda
# url = "https://download.pytorch.org/whl/cu121"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
numpy = "^1.26.4"
scikit-learn = "^1.4.2"
scikit-image = "^0.23.1"
pandas = "^2.2.2"
tqdm = "^4.66.2"
matplotlib = "^3.8.4"
seaborn = "^0.13.2"
opencv-python = "^4.9.0.80"
torch = { version = "^2.0.0", source = "pytorch-src" }
torchvision = "^0.17.0"
simple_parsing = "^0.1.7"
pyyaml = "^6.0.2"
pyfd = {git = "https://github.com/gablabc/PyFD.git", tag = "v0.1.0"}
ucimlrepo = "^0.0.7"
omegaconf = "^2.3.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
flake8 = "^7.1.2"
flake8-bugbear = "^22.8"
mypy = "^1.3.0"

[[tool.mypy.overrides]]
module = ['sklearn.*', 'yaml.*', 'joblib', 'pyfd.*', 'tqdm']
ignore_missing_imports = true

[tool.black]
line-length = 88
